<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Back to Lincolnshire</title>
  <meta name="description" content="Back to Lincolnshire: The Yellow Belly Alarm - find out if you're in Lincolnshire, and if not, how to get back." />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Back to Lincolnshire</h1>
    <p class="tagline">The Yellow Belly Alarm</p>
  </header>

  <main>
    <div class="controls">
      <div class="location-controls">
        <button id="use-location-btn" type="button">Use my location</button>
        <form id="address-form" class="address-form">
          <label for="address-input" class="visually-hidden">Address or place name</label>
          <input id="address-input" type="text" placeholder="Enter an address or place name" autocomplete="off" />
          <button type="submit">Find</button>
        </form>
      </div>
      <p id="location-message" class="message" role="status"></p>

      <label class="boundary-toggle">
        <span>Boundary:</span>
        <select id="boundary-select">
          <option value="ceremonial" selected>Ceremonial</option>
          <option value="administrative">Administrative</option>
        </select>
      </label>
    </div>

    <div id="map"></div>

    <p id="status-message" class="status-message" role="status"></p>

    <div id="route-result" class="route-result" hidden>
      <p id="route-primary" class="route-primary"></p>
      <ul id="route-alternatives" class="route-alternatives"></ul>
    </div>

    <div class="deadline-controls">
      <label for="deadline-time">Arrival deadline</label>
      <input id="deadline-time" type="time" value="15:00" />
      <label for="deadline-buffer">Buffer (minutes early)</label>
      <input id="deadline-buffer" type="number" min="0" max="60" step="1" value="10" />
    </div>

    <div id="alarm-banner" class="alarm-banner" hidden>
      <p id="alarm-message" class="alarm-message"></p>
      <p id="alarm-countdown" class="alarm-countdown"></p>
      <p id="alarm-stale-notice" class="alarm-stale-notice" hidden></p>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
