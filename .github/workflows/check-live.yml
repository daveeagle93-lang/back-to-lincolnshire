# Smoke-checks the live site (scripts/check-live.mjs) after every push to main.
# A FAIL fails the run; WARN lines (e.g. OSRM down) are printed but do not.
# The daily check is a systemd timer on tower-dev (see README).
name: Check live site

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # check-live reads _headers and functions/_shared/security-headers.js from the repo.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Give the Cloudflare Pages deploy time to land before checking.
      - name: Wait for the deploy
        run: sleep 120
      - run: npm run check-live
